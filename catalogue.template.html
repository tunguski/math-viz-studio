<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathViz Studio — Catalogue</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: radial-gradient(1200px 800px at 50% -10%, #11203c 0%, #070b14 60%);
        color: #e6edf3;
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
      }
      .cat { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

      /* Header + table of contents */
      .cat-head { margin-bottom: 36px; }
      .cat-title { font-size: 30px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
      .cat-sub { color: #8aa0b2; margin: 0 0 20px; font-size: 14.5px; }
      .cat-link { color: #5fd0ff; text-decoration: none; }
      .cat-link:hover { text-decoration: underline; }
      .cat-toc { display: flex; flex-wrap: wrap; gap: 7px; }
      .cat-chip {
        font-size: 12px; color: #aebfd0; text-decoration: none;
        border: 1px solid #243149; background: #0f1828; border-radius: 999px; padding: 4px 11px;
      }
      .cat-chip:hover { border-color: #3a5070; color: #e6edf3; }

      /* One section per visualisation */
      .cat-list { display: flex; flex-direction: column; gap: 22px; }
      .cat-sec { scroll-margin-top: 18px; }
      .cat-card {
        display: flex; gap: 26px; align-items: stretch;
        background: linear-gradient(180deg, #0e1726 0%, #0c1422 100%);
        border: 1px solid #1d2a40; border-radius: 16px; padding: 22px;
      }
      .cat-sample { flex: 0 0 360px; }
      .cat-stage {
        width: 360px; height: 360px; border: 1px solid #1f3050; border-radius: 12px;
        background: radial-gradient(circle at 50% 38%, #11203c 0%, #070b14 72%);
        overflow: hidden;
      }
      .cat-stage svg { display: block; width: 100%; height: 100%; }
      .cat-info { flex: 1 1 auto; min-width: 0; }
      .cat-name { font-size: 21px; font-weight: 800; margin: 2px 0 4px; }
      .cat-tag { color: #7f93a6; font-size: 13px; margin-bottom: 14px; }

      /* Formula card (SVG text, styled here so the Elm side stays simple) */
      .cat-formula {
        background: #070d17; border: 1px solid #1b2840; border-radius: 10px;
        padding: 6px 14px; margin-bottom: 16px;
      }
      .cat-formula svg { display: block; max-width: 100%; }
      .cat-formula text {
        font-family: "Cambria Math", Cambria, Georgia, "Times New Roman", serif;
        font-style: italic; font-size: 18px; fill: #d6e4f5;
      }

      .cat-p { color: #b6c4d6; margin: 0 0 11px; font-size: 14px; line-height: 1.7; }
      .cat-p:last-child { margin-bottom: 0; }

      .cat-foot { color: #5b6b7d; font-size: 12.5px; text-align: center; margin-top: 44px; }

      @media (max-width: 760px) {
        .cat-card { flex-direction: column; }
        .cat-sample { flex-basis: auto; }
        .cat-stage { width: 100%; height: auto; aspect-ratio: 1 / 1; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="catalogue.js"></script>
  </body>
</html>
