name: Deploy to GitHub Pages

# Builds MathViz Studio and publishes build/ to
# https://tunguski.github.io/math-viz-studio/.
#
# The app is compiled and served entirely by the elm-lang CLI (built from the tunguski/elm-lang repo
# as a runnable elm.jar) and reuses the editor shell modules vendored from tunguski/elm-editor — so
# CI checks out both sibling repos, builds the compiler, then runs the project's own build.sh
# (which calls `elm make`). No Node / npx is involved.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      # The elm-lang CLI (the compiler) and the elm-editor checkout (this app vendors its shell
      # modules) live in sibling tunguski repos.
      - name: Check out elm-lang (compiler) and elm-editor (vendored shell)
        run: |
          git clone --depth 1 --branch master https://github.com/tunguski/elm-lang.git   elm-lang
          git clone --depth 1 --branch master https://github.com/tunguski/elm-editor.git elm-editor

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build the elm-lang CLI (elm.jar)
        working-directory: elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests

      - name: Build MathViz Studio
        env:
          ELM: java -jar ${{ github.workspace }}/elm-lang/target/elm.jar
          EDITOR: ${{ github.workspace }}/elm-editor
        run: |
          chmod +x ./build.sh
          ./build.sh

      # Stamp the short commit hash + UTC build time into a tiny fixed-position badge, so anyone can
      # glance at the live page and confirm which commit is deployed and when it was built. The badge
      # is appended to <html> (not <body>) by a small script, so it survives Elm taking over the body.
      # NOTE: perl uses -0777 (slurp the whole file as one record), NOT -0: compiled HTML can contain a
      # NUL byte, and -0 treats NUL as the record separator — which would split the file and double the
      # injection (once mid-runtime, corrupting it).
      - name: Stamp commit hash + build time into the footer
        run: |
          SHA=$(git rev-parse --short HEAD)
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')
          export STAMP="built $WHEN · $SHA"
          echo "Stamping: $STAMP"
          find build -name '*.html' -print0 | xargs -0 -r perl -0777 -pi -e '
            my $t = $ENV{STAMP};
            my $s = "<script>(function(){function a(){"
                  . "if(document.getElementById(\"build-stamp\"))return;"
                  . "var d=document.createElement(\"div\");d.id=\"build-stamp\";d.textContent=\"$t\";"
                  . "d.title=\"deployed build\";"
                  . "d.style.cssText=\"position:fixed;bottom:4px;right:6px;z-index:2147483647;"
                  . "font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:rgba(150,165,190,.72);"
                  . "background:rgba(8,12,18,.55);padding:2px 7px;border-radius:6px;pointer-events:none;"
                  . "letter-spacing:.02em\";(document.documentElement||document.body).appendChild(d);}"
                  . "if(document.readyState!=\"loading\")a();"
                  . "else document.addEventListener(\"DOMContentLoaded\",a);})();<\/script>";
            if    (s#</body>#$s</body>#) {}
            elsif (s#</html>#$s</html>#) {}
            else  { $_ .= $s }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
